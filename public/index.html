<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cf-agent-memory</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --panel: #ffffff;
        --text: #1c1c1a;
        --muted: #6b6b66;
        --line: #e3e2dd;
        --accent: #1d6f5c;
        --accent-soft: #e6f2ee;
        --danger: #a33a2f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        padding: 18px 24px;
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      .sub { color: var(--muted); font-size: 12px; }
      main { max-width: 900px; margin: 0 auto; padding: 24px; display: grid; gap: 16px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .row { display: flex; gap: 8px; align-items: center; }
      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        font: inherit;
        background: #fff;
        color: inherit;
      }
      textarea { min-height: 74px; resize: vertical; }
      input:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
      button {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        border-radius: 8px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:hover { border-color: #c9c8c2; }
      button.primary:hover { opacity: 0.92; }
      .muted { color: var(--muted); font-size: 12px; }
      .item {
        border-top: 1px solid var(--line);
        padding: 12px 0;
        display: grid;
        gap: 6px;
      }
      .item:first-child { border-top: none; }
      .item-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
      .content { white-space: pre-wrap; word-break: break-word; }
      .meta { display: flex; gap: 6px; flex-wrap: wrap; }
      .tag {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .tag.key { color: var(--accent); border-color: #bcd9d0; background: var(--accent-soft); }
      .del { color: var(--danger); border: none; background: none; padding: 2px 4px; font-size: 12px; }
      .empty { color: var(--muted); padding: 8px 0; }
      #status { min-height: 18px; font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <header>
      <h1>cf-agent-memory</h1>
      <span class="sub">个人 Agent 长期记忆 · Cloudflare 免费层</span>
      <span class="sub" id="stats"></span>
    </header>

    <main>
      <section class="card">
        <div class="row" style="margin-bottom: 10px">
          <input id="token" type="password" placeholder="ADMIN_TOKEN（仅存本地浏览器）" />
          <button id="save">保存</button>
        </div>
        <div class="row">
          <input id="query" placeholder="搜索记忆，例如：数据库端口 / 部署方式" />
          <button class="primary" id="search">召回</button>
        </div>
        <div id="status"></div>
      </section>

      <section class="card">
        <textarea id="content" placeholder="新增一条记忆，例如：这个项目用 PostgreSQL 16，端口 8080，别改成 MySQL。"></textarea>
        <div class="row" style="margin-top: 10px">
          <input id="key" placeholder="可选：主题键，如 project.database" style="flex: 1" />
          <input id="tags" placeholder="可选：标签，逗号分隔" style="flex: 1" />
          <button class="primary" id="add">记住</button>
        </div>
      </section>

      <section class="card">
        <div class="row" style="justify-content: space-between; margin-bottom: 6px">
          <strong style="font-size: 13px">记忆列表</strong>
          <button id="reload">刷新</button>
        </div>
        <div id="list"><div class="empty">加载中…</div></div>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const state = { token: localStorage.getItem("cfam_token") || "", view: "list" };

      $("token").value = state.token;

      function headers() {
        return { "content-type": "application/json", authorization: `Bearer ${state.token}` };
      }

      function status(text) {
        $("status").textContent = text || "";
      }

      async function api(path, options = {}) {
        if (!state.token) throw new Error("请先填入 ADMIN_TOKEN");
        const response = await fetch(path, { ...options, headers: headers() });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return body;
      }

      function esc(value) {
        return String(value ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }

      function render(items) {
        const list = $("list");
        if (!items.length) {
          list.innerHTML = '<div class="empty">还没有记忆。先在上方写入一条。</div>';
          return;
        }
        list.innerHTML = items
          .map((item) => {
            const tags = (item.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("");
            const key = item.key ? `<span class="tag key">${esc(item.key)}</span>` : "";
            const via = (item.via || []).map((v) => `<span class="tag">${esc(v)}</span>`).join("");
            const date = new Date(item.createdAt || item.created_at).toLocaleString("zh-CN");
            return `<div class="item">
              <div class="item-head">
                <div class="content">${esc(item.content)}</div>
                <button class="del" data-id="${esc(item.id)}">删除</button>
              </div>
              <div class="meta">
                ${key}${tags}${via}
                <span class="tag">${esc(item.kind || "fact")}</span>
                <span class="tag">${esc(date)}</span>
              </div>
            </div>`;
          })
          .join("");

        list.querySelectorAll(".del").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("删除这条记忆？")) return;
            try {
              await api(`/v1/memories/${btn.dataset.id}`, { method: "DELETE" });
              status("已删除");
              load();
            } catch (error) {
              status(error.message);
            }
          });
        });
      }

      async function load() {
        try {
          const body = await api("/v1/memories?limit=50");
          render(body.memories || []);
          const stats = await api("/v1/stats");
          $("stats").textContent = `共 ${stats.stats.total} 条`;
          status("");
        } catch (error) {
          $("list").innerHTML = `<div class="empty">${esc(error.message)}</div>`;
        }
      }

      $("save").addEventListener("click", () => {
        state.token = $("token").value.trim();
        localStorage.setItem("cfam_token", state.token);
        status("已保存到本地");
        load();
      });

      $("add").addEventListener("click", async () => {
        const content = $("content").value.trim();
        if (!content) return;
        try {
          await api("/v1/memories", {
            method: "POST",
            body: JSON.stringify({
              content,
              key: $("key").value.trim() || undefined,
              tags: $("tags").value.split(",").map((t) => t.trim()).filter(Boolean),
            }),
          });
          $("content").value = "";
          $("key").value = "";
          $("tags").value = "";
          status("已记住");
          load();
        } catch (error) {
          status(error.message);
        }
      });

      $("search").addEventListener("click", async () => {
        const query = $("query").value.trim();
        if (!query) return load();
        try {
          const body = await api("/v1/recall", { method: "POST", body: JSON.stringify({ query, limit: 20 }) });
          render(
            body.hits.map((hit) => ({ ...hit.memory, via: hit.via })),
          );
          status(`命中 ${body.hits.length} 条 · 向量 ${body.diagnostics.vector} / 关键词 ${body.diagnostics.keyword}`);
        } catch (error) {
          status(error.message);
        }
      });

      $("query").addEventListener("keydown", (event) => {
        if (event.key === "Enter") $("search").click();
      });

      $("reload").addEventListener("click", load);

      if (state.token) load();
    </script>
  </body>
</html>
